spring:
  application:
    name: civictrack

  # ==========================================================================
  # READ THIS BEFORE CHANGING DATABASE_URL IN ANY DEPLOYED ENVIRONMENT.
  #
  # On Supabase, use the SESSION POOLER host:
  #     aws-0-<region>.pooler.supabase.com, port 5432,
  #     user postgres.<project-ref>
  #
  # NOT the direct host (db.<ref>.supabase.co) and NOT the transaction pooler.
  #
  # THE HOSTNAME IS THE TELL, NOT THE PORT. The session pooler and the
  # transaction pooler differ by port (5432 vs 6543); the direct host and the
  # session pooler differ only by hostname, and both are 5432. Reading the port
  # alone tells you nothing.
  #
  # Why the direct host fails: it is IPv6-only, and Render's free tier has no
  # IPv6 egress. It fails with "Network is unreachable" -- which reads like a
  # firewall problem and is not. This cost a day, twice, the second time after
  # a password rotation put the direct host back in the connection string.
  #
  # Why the TRANSACTION pooler fails, and fails worse -- intermittently, in a
  # way that looks exactly like a clustering bug:
  #   - Hibernate uses server-side prepared statements, which transaction
  #     pooling breaks.
  #   - The whole concurrency design rests on pg_advisory_xact_lock and
  #     FOR UPDATE row locks, both of which need a stable session.
  # Hikari below is already the pool. A second pooler in transaction mode is
  # not redundancy, it is a correctness bug.
  #
  # See DD-040.
  # ==========================================================================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civictrack}
    username: ${DATABASE_USER:civictrack}
    password: ${DATABASE_PASSWORD:civictrack}
    hikari:
      # Free-tier Postgres caps connections hard. This number is the real
      # concurrency ceiling of the whole application.
      maximum-pool-size: 8
      leak-detection-threshold: 20000

  jpa:
    # NON-NEGOTIABLE. Defaults to true, which holds a database connection
    # for the entire request lifecycle. With the pool capped at 8, the
    # 20-thread concurrency test exhausts the pool and the failure presents
    # as a phantom locking bug in the clustering engine. Do not change this.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Never 'update'. Hibernate cannot generate
      # the composite btree_gist index over a cast expression, so schema
      # authority has to sit in migrations; validate makes the app refuse
      # to start if entities and migrations have drifted.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  threads:
    # Enabled. No throughput claim is made on this basis: the Hikari pool
    # ceiling of 8 is the binding constraint on this workload, not the
    # thread model. The argument for Java here rests on declarative
    # transaction management and scheduling.
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: civictrack
    distribution:
      # p50/p95/p99 on the ingest path, instrumented from day one because
      # the week-7 evaluation needs these percentiles and retrofitting a
      # timing harness later produces worse numbers than Micrometer does.
      percentiles-histogram:
        http.server.requests: true
        civictrack.ingest: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        civictrack.ingest: 0.5, 0.95, 0.99

civictrack:
  clustering:
    # Properties of the sensing apparatus and of the concurrency strategy.
    # Anything that varies by defect type lives in the categories table
    # instead (standing rule 1).
    min-accuracy-m: 3
    max-accuracy-m: 150
    accuracy-contribution-cap-m: 60
    low-confidence-factor: 1.5
    cell-grid-degrees: 0.002
    search-radius-padding-m: 120
  sla:
    cron: "0 */5 * * * *"
    max-escalation-level: 4
    batch-size: 100
    # Floor on a re-armed deadline after an escalation. Without it, halving
    # eventually produces deadlines minutes away, which no crew can meet and
    # which therefore stop carrying any information.
    rearm-floor: PT2H
    # Demo profile only; see application-demo.yml. Zero everywhere else, and
    # SlaServiceTest asserts that it is zero so it cannot be left switched on.
    demo-override-hours: 0
  verification:
    timeout-hours: 72
    auto-close-days: 7
  security:
    jwt:
      # Development default. Deployment MUST override it: an attacker who knows
      # the signing key can mint an ADMIN token, which is the whole system.
      # TokenService refuses to start on anything shorter than 32 bytes.
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
      issuer: civictrack
      access-ttl: PT15M
      refresh-ttl: P30D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  # The nightly Cloudinary orphan sweep.
  #
  # The photo is uploaded from the browser BEFORE ingest is called -- on
  # purpose, so a slow third-party call never happens while the clustering
  # engine holds pg_advisory_xact_lock. The cost is that every abandoned
  # submission leaves an asset no report row points at.
  #
  # Absent api-key / api-secret means this does nothing at all, which is the
  # normal state locally. Note these are the ADMIN credentials and are nothing
  # to do with the browser upload, which uses an unsigned preset and holds no
  # secret (DD-053).
  #
  # dry-run DEFAULTS TO TRUE and should stay true until somebody has read a few
  # runs of the log. This job deletes things, on a schedule, unattended, based
  # on a query; if that query is wrong the damage is silent. min-age keeps it
  # away from assets still mid-submission, and max-deletions bounds a bad run.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    dry-run: ${CLOUDINARY_DRY_RUN:true}
    min-age: PT24H
    max-deletions: 200
    cron: "0 30 3 * * *"

logging:
  level:
    com.civictrack: DEBUG

# Profile used ONLY by the CDS training run inside the Dockerfile.
#
# The training run refreshes the application context and exits immediately
# (-Dspring.context.exit=onRefresh) so the JVM can dump a class-data archive.
# There is no database at image-build time, so everything that would dial one
# is switched off here. This profile never runs in a real environment.
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # Stops Hibernate opening a connection to sniff dialect metadata
        # during bootstrap. Without this the training run blocks and fails.
        boot.allow_jdbc_metadata_access: false
  datasource:
    url: jdbc:postgresql://cds-training-no-such-host:5432/civictrack
    username: cds
    password: cds
    hikari:
      # Never dialled, but make failure fast rather than a build hang.
      initialization-fail-timeout: -1

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed in · CivicTrack</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="shell">
  <div class="card panel">
    <header class="card-head">
      <div class="brand"><span class="brand-mark">◎</span> CivicTrack</div>
      <p class="tagline" id="greeting">Loading your session…</p>
    </header>

    <div class="panel-body">
      <div class="alert" id="error" hidden></div>

      <dl class="rows" id="rows" hidden>
        <div class="row"><dt>Name</dt><dd id="v-name"></dd></div>
        <div class="row"><dt>Email</dt><dd id="v-email"></dd></div>
        <div class="row"><dt>Phone</dt><dd id="v-phone"></dd></div>
        <div class="row"><dt>Role</dt><dd><span class="badge" id="v-role"></span></dd></div>
        <div class="row"><dt>User ID</dt><dd id="v-id"></dd></div>
      </dl>

      <p class="proof" id="proof" hidden>
        These values came from <strong>GET /api/v1/auth/me</strong>, a protected endpoint.
        The server returned them only because the request carried a valid signed JWT —
        no session, no cookie.
      </p>

      <button class="btn btn-secondary" id="signout">Sign out</button>
    </div>
  </div>
</main>

<script>
const token = localStorage.getItem("ct_access_token");

if (!token) {
  window.location.replace("/index.html");
}

function signOut() {
  localStorage.removeItem("ct_access_token");
  localStorage.removeItem("ct_refresh_token");
  window.location.replace("/index.html");
}

document.getElementById("signout").addEventListener("click", signOut);

(async function loadMe() {
  try {
    const response = await fetch("/api/v1/auth/me", {
      headers: { "Authorization": "Bearer " + token },
    });

    if (response.status === 401) {
      // Access token expired or invalid — back to the login screen.
      signOut();
      return;
    }
    if (!response.ok) {
      throw new Error("Request failed with " + response.status);
    }

    const user = await response.json();

    document.getElementById("greeting").textContent = "Signed in as " + user.fullName;
    document.getElementById("v-name").textContent = user.fullName;
    document.getElementById("v-email").textContent = user.email || "—";
    document.getElementById("v-phone").textContent = user.phone || "—";
    document.getElementById("v-role").textContent = user.role;
    document.getElementById("v-id").textContent = user.id;

    document.getElementById("rows").hidden = false;
    document.getElementById("proof").hidden = false;

  } catch (e) {
    document.getElementById("greeting").textContent = "Session problem";
    const box = document.getElementById("error");
    box.textContent = "Could not load your account. Is the backend running?";
    box.hidden = false;
  }
})();
</script>
</body>
</html>
